name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            ext: .exe
          - os: macos-latest
            name: macos-arm64
            ext: ""
          - os: ubuntu-latest
            name: linux-x64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: Collect binaries
        shell: bash
        run: |
          mkdir dist
          cp target/release/sideward${{ matrix.ext }} target/release/sideward-gui${{ matrix.ext }} dist/
          cp README.md LICENSE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sideward-${{ matrix.name }}
          path: dist
