# Fetches the CC0 scenery set (scripts/fetch-realism-assets.mjs) from Poly Haven and commits it to
# the branch that changed the script. GitHub's runners can reach Poly Haven; the dev sandbox can't.
# A commit made with GITHUB_TOKEN doesn't start other workflows, so this can't loop.

name: Realism assets

on:
  push:
    branches-ignore: [main]
    paths: [scripts/fetch-realism-assets.mjs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-realism-assets.mjs
      - name: Commit the assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/assets/realism
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add the CC0 scenery set from Poly Haven (fetched by the Realism assets workflow)"
          git push
